name: Keep Render Awake

on:
  schedule:
    # Target: every 14 minutes, ahead of Render's 15-minute spin-down.
    # NOTE: GitHub throttles scheduled workflows on free/public repos and
    # frequently drops runs entirely — observed spacing is 1-3 hours, not 14
    # minutes. Treat this as a best-effort backup; an external uptime monitor
    # (UptimeRobot / cron-job.org) is the reliable way to prevent cold starts.
    - cron: '*/14 * * * *'
  workflow_dispatch:

# A heartbeat only needs the newest ping. If an older run is still queued
# (GitHub runner capacity), drop it rather than letting runs pile up.
concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # Fail fast instead of hanging: a cold Render instance answers within
    # ~60s, so anything beyond this is a genuine problem worth surfacing.
    timeout-minutes: 5
    steps:
      - name: Ping Render backend health endpoint
        run: |
          curl --fail --show-error --silent \
               --max-time 120 \
               --retry 3 --retry-delay 15 --retry-all-errors \
               https://signalforge-ai.onrender.com/health
